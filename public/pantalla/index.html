<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla · Blockchain Demo</title>
  <link rel="stylesheet" href="/pantalla/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Blockchain Demo</h1>
    <div class="stat"><span class="label">Participantes</span><span class="num" id="participants">0</span></div>
    <div class="stat"><span class="label">Altura</span><span class="num" id="height">0</span></div>
    <div class="stat"><span class="label">Dificultad</span><span class="num" id="difficulty">-</span></div>
    <div class="stat"><span class="label">Próximo bloque</span><span class="num" id="countdown">-</span></div>
    <span id="status" class="badge" data-connected="false">Desconectado</span>
    <div id="qr-slot" class="qr-slot">
      <img id="qr-small" src="/qr.svg" alt="QR para unirse">
      <span id="url-small" class="url-small mono"></span>
    </div>
  </header>

  <div id="tamper-banner" class="tamper-banner" hidden>⚠ Cadena manipulada</div>

  <section class="chain-section">
    <h2>Cadena</h2>
    <div id="chain" class="chain"></div>
  </section>

  <section id="miner-strip" class="miner-strip">
    <div id="miner-title" class="miner-title">Esperando transacciones…</div>
    <div class="miner-nonce mono">nonce <b id="miner-nonce">-</b></div>
    <div id="miner-hash" class="miner-hash mono"></div>
  </section>

  <div class="lower">
    <section id="main-panel" class="main-panel" data-panel="qr">
      <h2 id="main-panel-title" class="main-panel-title"></h2>
      <div id="main-panel-body" class="main-panel-body"></div>
    </section>

    <div class="side">
      <section class="mempool-section">
        <h2>Mempool <span id="mempool-count" class="count">0</span></h2>
        <ul id="mempool" class="mempool"></ul>
      </section>
      <section class="log-section">
        <h2>Registro de contratos</h2>
        <ul id="contract-log" class="contract-log"></ul>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/pantalla/app.js"></script>
</body>
</html>
